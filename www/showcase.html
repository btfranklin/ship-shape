<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greebler Showcase</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a1a; color: #eee; margin: 0; padding: 20px; }
        h1 { text-align: center; margin-bottom: 30px; color: #fff; }
        .gallery-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); 
            gap: 20px; 
            max-width: 1400px; 
            margin: 0 auto; 
        }
        .gallery-item { 
            background: #2a2a2a; 
            border-radius: 8px; 
            overflow: hidden; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); 
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
        }
        .gallery-header {
            padding: 10px 15px;
            background: #333;
            border-bottom: 1px solid #444;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .gallery-title { font-weight: bold; font-size: 1.1em; color: #88c0d0; }
        .gallery-desc { font-size: 0.85em; color: #aaa; }
        .canvas-container {
            position: relative;
            width: 100%;
            padding-top: 100%; /* 1:1 Aspect Ratio */
            background: #000;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .controls { text-align: center; margin-bottom: 20px; }
        button { padding: 10px 20px; font-size: 1em; cursor: pointer; background: #444; color: #fff; border: none; border-radius: 4px; transition: background 0.2s; }
        button:hover { background: #555; }
        
        /* Tooltip/Details overlay */
        .overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.7);
            padding: 5px;
            font-size: 0.8em;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
        }
        .gallery-item:hover .overlay { opacity: 1; }
    </style>
</head>
<body>
    <h1>Greebler Component Showcase</h1>
    
    <div class="controls">
        <button id="refreshBtn">Regenerate All</button>
        <a href="index.html" style="margin-left: 20px; color: #88c0d0; text-decoration: none;">&larr; Back to Ship Playground</a>
    </div>

    <div class="gallery-grid" id="grid">
        <!-- Items will be injected here -->
    </div>

    <script type="module" src="/showcase.ts"></script>
</body>
</html>
