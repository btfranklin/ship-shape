<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <title>War Train Foundry</title>
    <style>
        body { font-family: sans-serif; display: flex; height: 100vh; margin: 0; overflow: hidden; background: #222; color: #eee; }
        #controls { width: 320px; background: #333; padding: 20px; overflow-y: auto; border-right: 1px solid #444; display: flex; flex-direction: column; gap: 10px; }
        #main { flex: 1; position: relative; background: #111; overflow: auto; padding: 24px; }
        canvas { display: block; box-shadow: 0 0 20px rgba(0,0,0,0.5); background: #050505; max-width: none; max-height: none; }
        .control-group { border-bottom: 1px solid #444; padding-bottom: 10px; margin-bottom: 10px; }
        .control-group label { display: block; margin-bottom: 5px; font-size: 0.9em; color: #ccc; }
        .control-group input[type="range"] { width: 100%; }
        .control-group input[type="number"] { width: 100%; box-sizing: border-box; background: #222; border: 1px solid #444; color: #fff; padding: 5px; }
        .control-group select { width: 100%; box-sizing: border-box; background: #222; border: 1px solid #444; color: #fff; padding: 5px; }
        button { padding: 10px; cursor: pointer; background: #444; color: #fff; border: 1px solid #555; border-radius: 4px; }
        button:hover { background: #555; }
        h2 { margin-top: 0; font-size: 1.2em; }
        .label-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .label-row label { margin-bottom: 0; }
        button.icon-button { width: 28px; height: 28px; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
        button.icon-button svg { width: 16px; height: 16px; fill: currentColor; }
    </style>
</head>
<body>
    <div id="main">
        <canvas id="engineCanvas"></canvas>
    </div>

    <div id="controls">
        <h2>War Train Foundry</h2>
        <div class="control-group">
            <label>Seed</label>
            <div style="display: flex; gap: 5px;">
                <input type="number" id="engineSeedInput" value="12345">
                <button id="engineRandomSeedBtn">🎲</button>
            </div>
        </div>

        <div class="control-group">
            <div class="label-row">
                <label for="engineHueInput">Metal Hue</label>
                <button id="engineHueRefreshBtn" class="icon-button" type="button" aria-label="Refresh engine color">
                    <svg viewBox="0 0 24 24" role="img" aria-hidden="true">
                        <path d="M3 12a9 9 0 0 1 15.5-6.4L21 3v6h-6l2.2-2.2A7 7 0 1 0 19 12h2a9 9 0 0 1-18 0z"></path>
                    </svg>
                </button>
            </div>
            <input type="range" id="engineHueInput" min="0" max="360" value="35">
        </div>

        <div class="control-group">
            <label>View</label>
            <select id="engineViewModeSelect">
                <option value="engine">Engine</option>
                <option value="car">Single Car</option>
                <option value="consist">Connected Consist</option>
            </select>
        </div>

        <div class="control-group">
            <label>Car Type</label>
            <select id="engineCarTypeSelect">
                <option value="mixed">Mixed</option>
                <option value="gun-car">Gun Car</option>
                <option value="escort-car">Escort Car</option>
                <option value="supply-car">Supply Car</option>
                <option value="flatbed">Flatbed</option>
            </select>
        </div>

        <div class="control-group">
            <label>Wheel Style</label>
            <select id="engineWheelStyleSelect">
                <option value="mixed">Mixed</option>
                <option value="spoked">Spoked</option>
                <option value="solid">Solid</option>
                <option value="counterweight">Counterweight</option>
            </select>
        </div>

        <div class="control-group">
            <label>Tender</label>
            <select id="engineTenderSelect">
                <option value="auto">Auto</option>
                <option value="yes">Always</option>
                <option value="no">Never</option>
            </select>
        </div>

        <div class="control-group">
            <label>Cowcatcher</label>
            <select id="engineCowcatcherSelect">
                <option value="auto">Auto</option>
                <option value="yes">Always</option>
                <option value="no">Never</option>
            </select>
        </div>

        <button id="engineGenerateBtn">Generate Train</button>
        <br><br>
        <div style="display: flex; flex-direction: column; gap: 10px;">
            <a href="index.html" style="color: #0ff; text-decoration: none; border-bottom: 1px dotted #0ff;">&larr; Back to Playground</a>
            <a href="steam_engine_element_gallery.html" style="color: #0ff; text-decoration: none; border-bottom: 1px dotted #0ff;">View Railway Element Gallery</a>
        </div>
    </div>
    <script type="module" src="/steam_engine_showcase.ts"></script>
</body>
</html>
