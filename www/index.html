<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <title>Ship Shape Playground</title>
    <style>
        :root {
            --bg-deep: #0a0d10;
            --bg-mid: #12171c;
            --panel: #1b2128;
            --panel-bright: #232b34;
            --panel-dark: #131920;
            --accent: #f2b24a;
            --accent-soft: #8fd1b2;
            --text: #e8e3d7;
            --muted: #98a4b0;
            --line: #2b333b;
            --shadow: rgba(0, 0, 0, 0.6);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            height: 100vh;
            font-family: "Trebuchet MS", "Gill Sans", sans-serif;
            background: radial-gradient(circle at top left, #1b232b 0%, #0f1419 45%, #07090c 100%);
            color: var(--text);
            overflow: hidden;
        }

        #app {
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .tab-bar {
            display: flex;
            gap: 10px;
            padding: 14px 18px;
            background: linear-gradient(90deg, #0d1116, #1b222b 50%, #0d1116 100%);
            border-bottom: 1px solid var(--line);
            box-shadow: 0 12px 20px rgba(0, 0, 0, 0.3);
            z-index: 10;
        }

        .tab-button {
            border: 1px solid transparent;
            background: linear-gradient(160deg, #1b222b, #141a21);
            color: var(--muted);
            padding: 10px 16px;
            border-radius: 999px;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-button:hover {
            color: var(--text);
            border-color: #303a44;
        }

        .tab-button.active {
            color: #0a0d10;
            background: linear-gradient(140deg, var(--accent), #f4d08a);
            border-color: #f0c76c;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.35);
        }

        .tab-panels {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .tab-panel {
            display: none;
            height: 100%;
        }

        .tab-panel.active {
            display: block;
        }

        .panel-split {
            display: flex;
            height: 100%;
            overflow: hidden;
        }

        .panel-main {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 20% 20%, #1a2027 0%, #0b0e12 70%);
            overflow: hidden;
        }

        #engineMain {
            display: block;
            overflow: auto;
            padding: 24px;
        }

        #engineCanvas {
            display: block;
            max-width: none;
            max-height: none;
        }

        .panel-controls {
            width: 320px;
            background: linear-gradient(180deg, var(--panel), var(--panel-dark));
            padding: 20px;
            overflow-y: auto;
            border-left: 1px solid var(--line);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        canvas {
            box-shadow: 0 0 24px var(--shadow);
            background: #050505;
            max-width: 95%;
            max-height: 95%;
            object-fit: contain;
        }

        .control-group {
            border-bottom: 1px solid var(--line);
            padding-bottom: 10px;
            margin-bottom: 10px;
        }

        .control-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.85em;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .control-group input[type="range"] { width: 100%; }
        .control-group input[type="number"],
        .control-group select {
            width: 100%;
            background: #0e141a;
            border: 1px solid #2b333b;
            color: var(--text);
            padding: 6px;
            border-radius: 6px;
        }

        button {
            padding: 10px;
            cursor: pointer;
            background: #1f262e;
            color: var(--text);
            border: 1px solid #313a45;
            border-radius: 6px;
        }

        button:hover { background: #2b343f; }

        h2 {
            margin-top: 0;
            font-size: 1.1em;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--accent-soft);
        }

        .label-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .label-row label { margin-bottom: 0; }

        button.icon-button {
            width: 28px;
            height: 28px;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border-radius: 50%;
            border: 1px solid #39424d;
        }

        button.icon-button svg { width: 16px; height: 16px; fill: currentColor; }

        .corner-label {
            position: absolute;
            bottom: 20px;
            right: 30px;
            color: #f6f0e4;
            font-size: 1.3em;
            letter-spacing: 0.12em;
            text-shadow: 0 2px 6px rgba(0,0,0,0.9);
        }

        .link-stack {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .link-stack a {
            color: var(--accent);
            text-decoration: none;
            border-bottom: 1px dotted var(--accent);
            padding-bottom: 2px;
        }

        .greeble-panel {
            background: linear-gradient(180deg, #0f1419, #0a0d10);
            overflow-y: auto;
            padding: 20px;
        }

        .greeble-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 20px;
        }

        .greeble-header h2 {
            margin: 0;
            color: var(--accent);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .gallery-item {
            background: #1a2027;
            border: 1px solid #2f3842;
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .gallery-header {
            padding: 10px;
            background: #242c35;
            font-weight: bold;
            border-bottom: 1px solid #2f3842;
        }

        .canvas-container {
            position: relative;
            width: 100%;
        }

        .canvas-container canvas {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 1 / 1;
            background: #000;
        }

        .overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.7);
            color: #ccc;
            padding: 10px;
            font-size: 0.85em;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        @media (max-width: 1000px) {
            .panel-split { flex-direction: column; }
            .panel-controls { width: 100%; border-left: none; border-top: 1px solid var(--line); }
            .corner-label { right: 20px; font-size: 1.05em; }
        }
    </style>
</head>
<body>
    <div id="app">
        <nav class="tab-bar" role="tablist">
            <button
                id="tab-capital-button"
                class="tab-button active"
                type="button"
                role="tab"
                aria-selected="true"
                aria-controls="tab-capital"
                data-tab-target="tab-capital"
            >
                Capital Ships
            </button>
            <button
                id="tab-steam-button"
                class="tab-button"
                type="button"
                role="tab"
                aria-selected="false"
                aria-controls="tab-steam"
                data-tab-target="tab-steam"
            >
                War Trains
            </button>
            <button
                id="tab-greebles-button"
                class="tab-button"
                type="button"
                role="tab"
                aria-selected="false"
                aria-controls="tab-greebles"
                data-tab-target="tab-greebles"
            >
                Greeble Library
            </button>
        </nav>

        <div class="tab-panels">
            <section id="tab-capital" class="tab-panel active" role="tabpanel" aria-labelledby="tab-capital-button">
                <div class="panel-split">
                    <div class="panel-main" id="main">
                        <canvas id="appCanvas"></canvas>
                        <div id="archetypeDisplay" class="corner-label"></div>
                    </div>

                    <div class="panel-controls" id="controls">
                        <h2>Capital Ships</h2>
                        <div class="control-group">
                            <label>Seed</label>
                            <div style="display: flex; gap: 5px;">
                                <input type="number" id="seedInput" value="12345">
                                <button id="randomSeedBtn">🎲</button>
                            </div>
                        </div>

                        <div class="control-group">
                            <div class="label-row">
                                <label for="hueInput">Base Color (Hue)</label>
                                <button id="hueRefreshBtn" class="icon-button" type="button" aria-label="Refresh ship color">
                                    <svg viewBox="0 0 24 24" role="img" aria-hidden="true">
                                        <path d="M3 12a9 9 0 0 1 15.5-6.4L21 3v6h-6l2.2-2.2A7 7 0 1 0 19 12h2a9 9 0 0 1-18 0z"></path>
                                    </svg>
                                </button>
                            </div>
                            <input type="range" id="hueInput" min="0" max="360" value="200">
                        </div>

                        <div class="control-group">
                            <label>Archetype</label>
                            <select id="archetypeSelect">
                                <option value="random">Random</option>
                                <option value="freight">Freight</option>
                                <option value="science">Science</option>
                                <option value="industry">Industry</option>
                                <option value="passenger">Passenger</option>
                                <option value="combat">Combat</option>
                            </select>
                        </div>

                        <div class="control-group">
                            <label>Mode</label>
                            <select id="modeSelect">
                                <option value="full">Full Ship</option>
                                <option value="shape">Structure (Wireframe)</option>
                                <option value="surface">Surface Detail</option>
                            </select>
                        </div>

                        <div class="control-group">
                            <label style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
                                <input type="checkbox" id="rainbowCheck">
                                <span>Rainbow Background (Test Transparency)</span>
                            </label>
                        </div>

                        <button id="generateBtn">Generate Ship</button>
                        <br><br>
                        <div class="link-stack">
                            <a href="element_showcase.html">Capital Ship Element Gallery</a>
                        </div>
                    </div>
                </div>
            </section>

            <section id="tab-steam" class="tab-panel" role="tabpanel" aria-labelledby="tab-steam-button">
                <div class="panel-split">
                    <div class="panel-main" id="engineMain">
                        <canvas id="engineCanvas"></canvas>
                    </div>

                    <div class="panel-controls" id="engineControls">
                        <h2>War Trains</h2>
                        <div class="control-group">
                            <label>Seed</label>
                            <div style="display: flex; gap: 5px;">
                                <input type="number" id="engineSeedInput" value="12345">
                                <button id="engineRandomSeedBtn">🎲</button>
                            </div>
                        </div>

                        <div class="control-group">
                            <div class="label-row">
                                <label for="engineHueInput">Metal Hue</label>
                                <button id="engineHueRefreshBtn" class="icon-button" type="button" aria-label="Refresh engine color">
                                    <svg viewBox="0 0 24 24" role="img" aria-hidden="true">
                                        <path d="M3 12a9 9 0 0 1 15.5-6.4L21 3v6h-6l2.2-2.2A7 7 0 1 0 19 12h2a9 9 0 0 1-18 0z"></path>
                                    </svg>
                                </button>
                            </div>
                            <input type="range" id="engineHueInput" min="0" max="360" value="35">
                        </div>

                        <div class="control-group">
                            <label>View</label>
                            <select id="engineViewModeSelect">
                                <option value="engine">Engine</option>
                                <option value="car">Single Car</option>
                                <option value="consist">Connected Consist</option>
                            </select>
                        </div>

                        <div class="control-group">
                            <label>Car Type</label>
                            <select id="engineCarTypeSelect">
                                <option value="mixed">Mixed</option>
                                <option value="gun-car">Gun Car</option>
                                <option value="escort-car">Escort Car</option>
                                <option value="supply-car">Supply Car</option>
                                <option value="flatbed">Flatbed</option>
                            </select>
                        </div>

                        <div class="control-group">
                            <label>Wheel Style</label>
                            <select id="engineWheelStyleSelect">
                                <option value="mixed">Mixed</option>
                                <option value="spoked">Spoked</option>
                                <option value="solid">Solid</option>
                                <option value="counterweight">Counterweight</option>
                            </select>
                        </div>

                        <div class="control-group">
                            <label>Tender</label>
                            <select id="engineTenderSelect">
                                <option value="auto">Auto</option>
                                <option value="yes">Always</option>
                                <option value="no">Never</option>
                            </select>
                        </div>

                        <div class="control-group">
                            <label>Cowcatcher</label>
                            <select id="engineCowcatcherSelect">
                                <option value="auto">Auto</option>
                                <option value="yes">Always</option>
                                <option value="no">Never</option>
                            </select>
                        </div>

                        <button id="engineGenerateBtn">Generate Train</button>
                        <br><br>
                        <div class="link-stack">
                            <a href="steam_engine_element_gallery.html">Railway Element Gallery</a>
                        </div>
                    </div>
                </div>
            </section>

            <section id="tab-greebles" class="tab-panel greeble-panel" role="tabpanel" aria-labelledby="tab-greebles-button">
                <div class="greeble-header">
                    <h2>Greeble Library</h2>
                    <button id="refreshBtn">Refresh All Greebles</button>
                </div>
                <div id="grid" class="grid"></div>
            </section>
        </div>
    </div>
    <script type="module" src="/tabs.ts"></script>
    <script type="module" src="/main.ts"></script>
    <script type="module" src="/steam_engine_showcase.ts"></script>
    <script type="module" src="/greeble_showcase.ts"></script>
</body>
</html>
