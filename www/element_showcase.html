<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ship Element Showcase</title>
    <style>
        body { font-family: sans-serif; background: #222; color: #eee; padding: 20px; }
        h1 { border-bottom: 1px solid #444; padding-bottom: 10px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .element-row { display: flex; gap: 20px; background: #333; padding: 20px; margin-bottom: 20px; border-radius: 8px; align-items: center; }
        .element-visual { flex: 0 0 300px; height: 200px; background: #111; display: flex; align-items: center; justify-content: center; border: 1px solid #444; }
        .element-info { flex: 1; }
        .element-info h2 { margin-top: 0; color: #fff; }
        .element-info .archetype { color: #0ff; font-weight: bold; margin-bottom: 10px; display: block; }
        .greeble-list { margin-top: 10px; padding-left: 20px; color: #aaa; line-height: 1.6; }
        canvas { max-width: 100%; max-height: 100%; object-fit: contain; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Ship Element Library</h1>
        <p><a href="index.html" style="color: #0ff;">&larr; Back to Playground</a></p>
        
        <div style="margin-bottom: 20px; padding: 10px; background: #333; border-radius: 4px;">
            <label for="archetypeSelect" style="color: #ccc; margin-right: 10px;">Archetype:</label>
            <select id="archetypeSelect" style="padding: 5px; background: #222; color: #fff; border: 1px solid #444;">
                <option value="science">Science (Default)</option>
                <option value="freight">Freight</option>
                <option value="industry">Industry</option>
                <option value="passenger">Passenger</option>
                <option value="combat">Combat</option>
            </select>
        </div>

        <div id="list"></div>
    </div>
    
    <script type="module" src="/element_showcase.ts"></script>
</body>
</html>
