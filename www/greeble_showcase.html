<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Greeble Showcase</title>
        <style>
            body { font-family: sans-serif; background: #222; color: #eee; padding: 20px; }
            h1 { border-bottom: 1px solid #444; padding-bottom: 10px; }
            .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
            
            .gallery-item { background: #333; border: 1px solid #444; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
            .gallery-header { padding: 10px; background: #444; font-weight: bold; border-bottom: 1px solid #555; }
            
            .canvas-container { position: relative; width: 100%; }
            canvas { display: block; width: 100%; height: auto; aspect-ratio: 1 / 1; background: #000; }
            
            .overlay { 
                position: absolute; 
                bottom: 0; 
                left: 0; 
                right: 0; 
                background: rgba(0, 0, 0, 0.7); 
                color: #ccc; 
                padding: 10px; 
                font-size: 0.9em;
                border-top: 1px solid rgba(255,255,255,0.1);
            }
        </style>
    </head>
    <body>
        <h1>Greeble Library Showcase</h1>
        <p><a href="index.html" style="color: #0ff;">&larr; Back to Playground</a></p>
        <button id="refreshBtn" style="margin-bottom: 20px; padding: 10px 20px; background: #555; border: none; border-radius: 5px; color: white; cursor: pointer;">Refresh All Greebles</button>
        <div id="grid" class="grid"></div>
        
        <script type="module" src="/greeble_showcase.ts"></script>
    </body>
    </html>
