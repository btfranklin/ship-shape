<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <title>Railway Element Gallery</title>
    <style>
        body { font-family: sans-serif; background: #222; color: #eee; padding: 20px; }
        h1 { border-bottom: 1px solid #444; padding-bottom: 10px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .element-row { display: flex; gap: 20px; background: #333; padding: 20px; margin-bottom: 20px; border-radius: 8px; align-items: center; }
        .element-visual { flex: 0 0 300px; height: 200px; background: #111; display: flex; align-items: center; justify-content: center; border: 1px solid #444; }
        .element-info { flex: 1; }
        .element-info h2 { margin-top: 0; color: #fff; }
        .element-info .tagline { color: #f2b24a; font-weight: bold; margin-bottom: 10px; display: block; }
        .detail-list { margin-top: 10px; padding-left: 20px; color: #aaa; line-height: 1.6; }
        canvas { max-width: 100%; max-height: 100%; object-fit: contain; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Railway Element Gallery</h1>
        <p><a href="index.html" style="color: #0ff;">&larr; Back to Playground</a></p>

        <div style="margin-bottom: 20px; padding: 10px; background: #333; border-radius: 4px;">
            <label for="hueInput" style="color: #ccc; margin-right: 10px;">Metal Hue:</label>
            <input type="range" id="hueInput" min="0" max="360" value="35" style="width: 200px;">
            <button id="refreshAllBtn" style="margin-left: 10px; padding: 6px 12px; background: #444; color: #fff; border: 1px solid #555; cursor: pointer;">Refresh All</button>
        </div>

        <div id="list"></div>
    </div>
    <script type="module" src="/steam_engine_element_gallery.ts"></script>
</body>
</html>
